services:
  db:
    image: postgres:15
    container_name: greenwheel_postgres
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_pass
      POSTGRES_DB: dbt_demo
    ports:
      - "5432:5432"
    volumes:
      - greenwheel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d dbt_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  greenwheel_pg_data:
